<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boiler History</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0f1115; --card:#1a1d24; --fg:#e8eaed; --muted:#9aa0a6;
    --ok:#34c759; --bad:#ff3b30; --warn:#ff9f0a; --line:#2a2e37; --accent:#0a84ff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f3f4f6; --card:#fff; --fg:#1a1d24; --muted:#6b7280; --line:#e5e7eb; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:16px; }
  .wrap { max-width:960px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  a { color:var(--accent); text-decoration:none; }
  .nav { margin-bottom:16px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  .stats { display:grid; gap:10px; grid-template-columns:repeat(2,1fr); }
  @media (min-width:620px){ .stats { grid-template-columns:repeat(4,1fr); } }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .stat .v { font-size:22px; font-weight:700; }
  .stat .l { color:var(--muted); font-size:12px; }
  .ctls { margin-bottom:14px; }
  .ctls button { background:var(--card); color:var(--fg); border:1px solid var(--line);
    border-radius:999px; padding:6px 14px; margin-right:6px; cursor:pointer; font-size:13px; }
  .ctls button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  canvas { width:100% !important; }
  /* status strips */
  .strip { display:flex; align-items:center; gap:10px; margin:7px 0; }
  .strip .name { width:72px; color:var(--muted); font-size:13px; flex:none; }
  .bar { display:flex; flex:1; height:18px; border-radius:5px; overflow:hidden;
    border:1px solid var(--line); background:var(--line); }
  .bar span { flex:1 1 0; min-width:0; }
  .lgnd { color:var(--muted); font-size:12px; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--card); }
  .tbl-wrap { max-height:420px; overflow:auto; }
  .pill { font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px; }
  .pill.on { background:rgba(52,199,89,.18); color:var(--ok); }
  .pill.off { background:var(--line); color:var(--muted); }
  .pill.bad { background:rgba(255,59,48,.18); color:var(--bad); }
  .pill.warn { background:rgba(255,159,10,.18); color:var(--warn); }
  .empty { color:var(--muted); padding:20px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 Boiler History</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="nav">← <a href="index.html">Live dashboard</a></div>

  <div class="ctls" id="ctls">
    <button data-h="24">24 h</button>
    <button data-h="72">3 d</button>
    <button data-h="168" class="on">7 d</button>
    <button data-h="0">All</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h2>Boiler temperature (°F)</h2>
    <canvas id="tempChart" height="110"></canvas>
  </div>

  <div class="card">
    <h2>Status timeline <span style="color:var(--muted);font-weight:400;font-size:12px">(oldest → newest)</span></h2>
    <div id="strips"></div>
    <div class="lgnd">🟩 on / firing &nbsp;·&nbsp; ⬛ off &nbsp;·&nbsp; 🟧 heating &nbsp;·&nbsp; 🟦 dhw &nbsp;·&nbsp; 🟥 error / screen out</div>
  </div>

  <div class="card">
    <h2>Recent readings</h2>
    <div class="tbl-wrap"><table id="tbl"><thead><tr>
      <th>Time</th><th>Temp</th><th>Mode</th><th>Flame</th>
      <th>Pwr</th><th>Z1</th><th>Z2</th><th>Z3</th><th>Errors</th>
    </tr></thead><tbody id="tbody"></tbody></table></div>
  </div>

  <div class="sub" style="text-align:center">Captured hourly by GitHub Actions · auto-refreshes every 5 min</div>
</div>

<script>
const $ = id => document.getElementById(id);
let ALL = [];        // parsed records
let WINDOW_H = 168;  // hours
let tempChart = null;

const COL = { on:"#34c759", off:"#3a3f4b", heating:"#ff9f0a", dhw:"#0a84ff", err:"#ff3b30" };

function tempNum(s){ if(s==null) return null; const m=String(s).match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }

function parseLine(obj){
  const b = (obj.boiler && obj.boiler.reading) || {};
  const z = (obj.zone && obj.zone.reading) || {};
  const codes = (b.error_codes||[]).filter(Boolean);
  return {
    t: obj.local || obj.timestamp || "",
    ts: Date.parse(obj.timestamp || obj.local) || 0,
    temp: tempNum(b.temperature),
    mode: b.mode || (b.legible===false ? "unknown" : null),
    flame: b.flame_on === true,
    legible: b.legible !== false,
    codes,
    power: z.power === true, z1: z.zone1===true, z2: z.zone2===true, z3: z.zone3===true,
    hasZone: ("power" in z),
  };
}

function windowed(){
  if(!WINDOW_H) return ALL;
  const cut = Date.now() - WINDOW_H*3600*1000;
  const w = ALL.filter(r => r.ts >= cut);
  return w.length ? w : ALL.slice(-50);  // fall back if timestamps sparse
}

function fmtTime(t){ const d=new Date(t); return isNaN(d)? t : d.toLocaleString([], {month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}); }

function renderStats(rows){
  const temps = rows.map(r=>r.temp).filter(v=>v!=null);
  const flameOn = rows.filter(r=>r.flame).length;
  const last = rows[rows.length-1] || {};
  const pct = rows.length ? Math.round(100*flameOn/rows.length) : 0;
  const cards = [
    ["Readings", rows.length],
    ["Temp range", temps.length ? `${Math.min(...temps)}–${Math.max(...temps)}°` : "—"],
    ["Flame on", `${pct}%`],
    ["Now", last.temp!=null ? `${last.temp}° ${last.mode||""}` : "—"],
  ];
  $("stats").innerHTML = cards.map(([l,v])=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
}

function renderTemp(rows){
  const labels = rows.map(r=>fmtTime(r.ts||r.t));
  const data = rows.map(r=>r.temp);
  const css = getComputedStyle(document.documentElement);
  const grid = css.getPropertyValue("--line").trim();
  const fg = css.getPropertyValue("--muted").trim();
  if(tempChart) tempChart.destroy();
  tempChart = new Chart($("tempChart"), {
    type:"line",
    data:{ labels, datasets:[{ label:"°F", data, spanGaps:true,
      borderColor:"#ff9f0a", backgroundColor:"rgba(255,159,10,.12)", fill:true,
      tension:.3, pointRadius: rows.length>60?0:2, borderWidth:2 }]},
    options:{ responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{display:false} },
      scales:{ x:{ ticks:{ color:fg, maxTicksLimit:8, autoSkip:true }, grid:{color:grid} },
               y:{ ticks:{ color:fg }, grid:{color:grid} } } }
  });
}

function strip(name, rows, colorFn){
  const cells = rows.map(r=>`<span style="background:${colorFn(r)}" title="${fmtTime(r.ts||r.t)}"></span>`).join("");
  return `<div class="strip"><div class="name">${name}</div><div class="bar">${cells}</div></div>`;
}

function renderStrips(rows){
  const el = $("strips");
  if(!rows.length){ el.innerHTML = '<div class="empty">No data in this window yet.</div>'; return; }
  const bool = (on)=> on?COL.on:COL.off;
  let html = "";
  html += strip("Flame", rows, r=> r.flame?COL.on:COL.off);
  html += strip("Mode",  rows, r=> !r.legible?COL.err : r.mode==="heating"?COL.heating : r.mode==="dhw"?COL.dhw : r.mode==="unknown"?COL.err : COL.off);
  html += strip("Errors",rows, r=> (r.codes.length||!r.legible)?COL.err:COL.off);
  html += strip("Power", rows, r=> bool(r.power));
  html += strip("Zone 1",rows, r=> bool(r.z1));
  html += strip("Zone 2",rows, r=> bool(r.z2));
  html += strip("Zone 3",rows, r=> bool(r.z3));
  el.innerHTML = html;
}

function renderTable(rows){
  const P=(on)=>`<span class="pill ${on?'on':'off'}">${on?'ON':'·'}</span>`;
  const body = rows.slice().reverse().slice(0,60).map(r=>{
    const mode = !r.legible ? `<span class="pill bad">screen out</span>`
      : r.mode==="heating" ? `<span class="pill warn">heating</span>`
      : r.mode==="dhw" ? `<span class="pill" style="background:rgba(10,132,255,.18);color:#0a84ff">dhw</span>`
      : `<span class="pill off">${r.mode||'—'}</span>`;
    const err = r.codes.length ? `<span class="pill bad">${r.codes.join(", ")}</span>` : "—";
    return `<tr><td>${fmtTime(r.ts||r.t)}</td><td>${r.temp??'—'}</td><td>${mode}</td>
      <td>${r.flame?'🔥':'·'}</td><td>${P(r.power)}</td><td>${P(r.z1)}</td>
      <td>${P(r.z2)}</td><td>${P(r.z3)}</td><td>${err}</td></tr>`;
  }).join("");
  $("tbody").innerHTML = body || `<tr><td colspan="9" class="empty">No readings yet.</td></tr>`;
}

function renderAll(){
  const rows = windowed();
  renderStats(rows); renderTemp(rows); renderStrips(rows); renderTable(rows);
  $("sub").textContent = `${ALL.length} readings total · showing ${rows.length}`;
}

async function load(){
  try{
    const r = await fetch("stills/readings.jsonl?t="+Date.now(), {cache:"no-store"});
    const text = await r.text();
    ALL = text.trim().split("\n").filter(Boolean).map(l=>{ try{return parseLine(JSON.parse(l));}catch(e){return null;} }).filter(Boolean);
    ALL.sort((a,b)=>a.ts-b.ts);
    renderAll();
  }catch(e){ $("sub").textContent = "Could not load history ("+e+")"; }
}

$("ctls").addEventListener("click", e=>{
  if(e.target.tagName!=="BUTTON") return;
  WINDOW_H = parseInt(e.target.dataset.h,10);
  [...$("ctls").children].forEach(b=>b.classList.toggle("on", b===e.target));
  renderAll();
});

load();
setInterval(load, 5*60*1000);
</script>
</body>
</html>
