name: tapo-monitor

# Runs every 30 minutes in GitHub's cloud - independent of any laptop. Also runnable on demand
# from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min at :07 and :37 (top-of-hour is the most congested/delayed)
  workflow_dispatch: {}

# Let the job commit the latest stills + readings back to the repo.
permissions:
  contents: write

# Never run two cycles at once.
concurrency:
  group: tapo-monitor
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Capture + analyze one cycle
        env:
          TPLINK_EMAIL:         ${{ secrets.TPLINK_EMAIL }}
          TPLINK_PASSWORD:      ${{ secrets.TPLINK_PASSWORD }}
          TPLINK_TERMINAL_UUID: ${{ secrets.TPLINK_TERMINAL_UUID }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          TWILIO_ACCOUNT_SID:    ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:     ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_API_KEY_SID:    ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_FROM:           ${{ secrets.TWILIO_FROM }}
          ALERT_TO:              ${{ secrets.ALERT_TO }}
        # Primary model: Sonnet 5.5 (10/10 on the 2026-10-16 benchmark, half the cost of Opus).
        # Low-confidence / error / unreadable frames are re-read on Opus (--confirm-model default).
        run: python monitor.py --once --model claude-sonnet-5-5

      - name: Trim logs to the last 4000 lines (~83 days at 48/day)
        run: |
          for f in stills/readings.jsonl stills/alerts.jsonl; do
            if [ -f "$f" ]; then tail -n 4000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; fi
          done

      - name: Commit results
        run: |
          git config user.name  "tapo-monitor-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add each output only if it exists: a single missing pathspec (e.g. alerts.jsonl
          # before the first alert) makes `git add` abort and stage NOTHING.
          for f in stills/boiler_latest.jpg stills/zone_latest.jpg \
                   stills/readings.jsonl stills/readings_latest.json \
                   stills/alert_state.json stills/alerts.jsonl; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "readings $(date -u +%Y-%m-%dT%H:%MZ)"
            # Rebase onto anything pushed since checkout (e.g. a dashboard edit) so the push can't be rejected.
            git pull --rebase origin main
            git push
          fi
