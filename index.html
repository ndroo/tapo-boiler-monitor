<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boiler Monitor</title>
<style>
  :root {
    --bg:#0f1115; --card:#1a1d24; --fg:#e8eaed; --muted:#9aa0a6;
    --ok:#34c759; --bad:#ff3b30; --warn:#ff9f0a; --dhw:#0a84ff; --line:#2a2e37; --accent:#0a84ff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f3f4f6; --card:#fff; --fg:#1a1d24; --muted:#6b7280; --line:#e5e7eb; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:16px; }
  .wrap { max-width:960px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 2px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .sub { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:16px; }
  .banner { padding:11px 14px; border-radius:12px; margin:14px 0; font-weight:600; display:none; }
  .banner.ok  { display:block; background:rgba(52,199,89,.12); color:var(--ok); border:1px solid rgba(52,199,89,.3); }
  .banner.bad { display:block; background:rgba(255,59,48,.12); color:var(--bad); border:1px solid rgba(255,59,48,.3); }

  /* live cards */
  .cards { display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:680px){ .cards { grid-template-columns:1fr 1fr; } }
  .cam { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .cam h2 { padding:12px 14px; margin:0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .cam img { width:100%; display:block; background:#000; aspect-ratio:16/9; object-fit:cover; }
  .rows { padding:10px 14px; }
  .row { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line); }
  .row:last-child { border-bottom:0; } .row .k { color:var(--muted); }
  .pill { font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; }
  .pill.ok{background:rgba(52,199,89,.16);color:var(--ok)} .pill.bad{background:rgba(255,59,48,.16);color:var(--bad)}
  .pill.warn{background:rgba(255,159,10,.16);color:var(--warn)} .pill.dhw{background:rgba(10,132,255,.16);color:var(--dhw)}
  .pill.off{background:var(--line);color:var(--muted)}

  /* controls */
  .ctls { margin-bottom:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .ctls button { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:999px;
    padding:6px 14px; cursor:pointer; font-size:13px; }
  .ctls button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .ctls .range { color:var(--muted); font-size:13px; margin-left:auto; }

  /* timeline */
  #tl { position:relative; width:100%; overflow:hidden; }
  #tl svg { display:block; width:100%; }
  .tip { position:absolute; pointer-events:none; background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:7px 9px; font-size:12px; line-height:1.45; box-shadow:0 4px 14px rgba(0,0,0,.25);
    transform:translate(-50%,0); white-space:nowrap; display:none; z-index:5; }
  .tip b { font-weight:700; }
  .lgnd { color:var(--muted); font-size:12px; margin-top:10px; display:flex; gap:14px; flex-wrap:wrap; }
  .lgnd span { display:inline-flex; align-items:center; gap:5px; }
  .sw { width:11px; height:11px; border-radius:3px; display:inline-block; }

  /* table */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--card); }
  .tbl-wrap { max-height:380px; overflow:auto; }
  .empty { color:var(--muted); padding:20px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔥 Boiler Monitor</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="banner" id="banner"></div>

  <!-- LIVE NOW -->
  <div class="cards">
    <div class="cam">
      <h2>Boiler <span id="b-mode" class="pill off">—</span></h2>
      <img id="b-img" alt="boiler" src="stills/boiler_latest.jpg">
      <div class="rows" id="b-rows"></div>
    </div>
    <div class="cam">
      <h2>Zone controller <span id="z-pwr" class="pill off">—</span></h2>
      <img id="z-img" alt="zone" src="stills/zone_latest.jpg">
      <div class="rows" id="z-rows"></div>
    </div>
  </div>

  <!-- UNIFIED TIMELINE -->
  <div class="card">
    <h2>Timeline</h2>
    <div class="ctls" id="ctls">
      <button data-h="24">24 h</button>
      <button data-h="72">3 d</button>
      <button data-h="168" class="on">7 d</button>
      <button data-h="0">All</button>
      <span class="range" id="rangeLbl"></span>
    </div>
    <div id="tl"><div class="tip" id="tip"></div></div>
    <div class="lgnd">
      <span><i class="sw" style="background:#ff7a1a"></i>flame / heating</span>
      <span><i class="sw" style="background:#0a84ff"></i>dhw</span>
      <span><i class="sw" style="background:#34c759"></i>on</span>
      <span><i class="sw" style="background:#ff3b30"></i>error / screen out</span>
      <span><i class="sw" style="background:#3a3f4b"></i>off</span>
    </div>
  </div>

  <!-- ALERT HISTORY -->
  <div class="card">
    <h2>Alert history</h2>
    <div class="tbl-wrap"><table><thead><tr>
      <th>Time</th><th>Type</th><th>Delivery</th><th>Details</th>
    </tr></thead><tbody id="abody"></tbody></table></div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <h2>Readings</h2>
    <div class="tbl-wrap"><table><thead><tr>
      <th>Time</th><th>Temp</th><th>Mode</th><th>Flame</th><th>Pwr</th><th>Z1</th><th>Z2</th><th>Z3</th><th>Errors</th>
    </tr></thead><tbody id="tbody"></tbody></table></div>
  </div>

  <div class="sub" style="text-align:center">Captured hourly by GitHub Actions · auto-refreshes every 5 min</div>
</div>

<script>
const $ = id => document.getElementById(id);
const COL = { on:"#34c759", off:"#3a3f4b", fire:"#ff7a1a", dhw:"#0a84ff", err:"#ff3b30" };
let ALL = [], WINDOW_H = 168;

function tempNum(s){ if(s==null) return null; const m=String(s).match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }
function parseLine(o){
  const b=(o.boiler&&o.boiler.reading)||{}, z=(o.zone&&o.zone.reading)||{};
  return { ts: Date.parse(o.timestamp||o.local)||0, t:o.local||o.timestamp||"",
    temp:tempNum(b.temperature), mode:b.mode||(b.legible===false?"unknown":null),
    flame:b.flame_on===true, legible:b.legible!==false, codes:(b.error_codes||[]).filter(Boolean),
    power:z.power===true, z1:z.zone1===true, z2:z.zone2===true, z3:z.zone3===true,
    hasB:("legible" in b)||("temperature" in b), hasZ:("power" in z) };
}
function windowed(){
  if(!WINDOW_H) return ALL;
  const cut = Date.now() - WINDOW_H*3600e3;
  const w = ALL.filter(r=>r.ts>=cut);
  return w.length>=2 ? w : ALL.slice(-Math.max(2,w.length));
}
function fmt(ts,long){ const d=new Date(ts); if(isNaN(d)) return "";
  return d.toLocaleString([], long?{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}
                             :{month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}); }

/* ---------------- unified SVG timeline ---------------- */
const LANES = [
  {key:"flame", label:"Flame",  color:r=> r.flame?COL.fire:COL.off},
  {key:"mode",  label:"Mode",   color:r=> !r.legible?COL.err : r.mode==="heating"?COL.fire : r.mode==="dhw"?COL.dhw : r.mode==="idle"?COL.off : COL.err},
  {key:"err",   label:"Errors", color:r=> (r.codes.length||!r.legible)?COL.err:COL.off},
  {key:"power", label:"Power",  color:r=> r.power?COL.on:COL.off},
  {key:"z1",    label:"Zone 1", color:r=> r.z1?COL.on:COL.off},
  {key:"z2",    label:"Zone 2", color:r=> r.z2?COL.on:COL.off},
  {key:"z3",    label:"Zone 3", color:r=> r.z3?COL.on:COL.off},
];
let SAMP = [];  // {ts,x} for hover

function renderTimeline(rows){
  const host=$("tl"); const W=host.clientWidth||680;
  const ML=52, MR=14, PT=10, TH=120, GAP=14, LH=20, LG=4, AX=26;
  const plotW=Math.max(40, W-ML-MR);
  const lanesTop = PT+TH+GAP;
  const H = lanesTop + LANES.length*(LH+LG) + AX;
  const css=getComputedStyle(document.documentElement);
  const line=css.getPropertyValue("--line").trim(), muted=css.getPropertyValue("--muted").trim(), fg=css.getPropertyValue("--fg").trim();

  if(!rows.length){ host.innerHTML='<div class="empty">No data in this window yet.</div><div class="tip" id="tip"></div>'; return; }

  let tmin=rows[0].ts, tmax=rows[rows.length-1].ts;
  if(tmax-tmin < 3600e3) tmax = tmin + 3600e3;
  const span=Math.max(1,tmax-tmin);
  const x = ts => ML + ((ts-tmin)/span)*plotW;

  // temperature scale
  const temps=rows.map(r=>r.temp).filter(v=>v!=null);
  let tlo = temps.length?Math.min(...temps):60, thi = temps.length?Math.max(...temps):180;
  if(thi-tlo < 8){ const m=(thi+tlo)/2; tlo=m-6; thi=m+6; }
  const padv=(thi-tlo)*0.12; tlo-=padv; thi+=padv;
  const yT = v => PT + TH - ((v-tlo)/(thi-tlo))*TH;

  // median interval for band fallback width
  const diffs=[]; for(let i=1;i<rows.length;i++) diffs.push(rows[i].ts-rows[i-1].ts);
  diffs.sort((a,b)=>a-b); const med = diffs.length?diffs[Math.floor(diffs.length/2)]:3600e3;

  let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;

  // --- shared vertical time gridlines + bottom axis ---
  const nTicks=Math.min(7, Math.max(3, Math.round(plotW/110)));
  const ticks=[]; for(let i=0;i<=nTicks;i++) ticks.push(tmin + span*i/nTicks);
  ticks.forEach(tt=>{ const xx=x(tt);
    s+=`<line x1="${xx}" y1="${PT}" x2="${xx}" y2="${lanesTop+LANES.length*(LH+LG)-LG}" stroke="${line}" stroke-width="1"/>`;
    s+=`<text x="${xx}" y="${H-8}" fill="${muted}" font-size="10" text-anchor="middle">${fmt(tt,false)}</text>`;
  });

  // --- temperature panel ---
  s+=`<rect x="${ML}" y="${PT}" width="${plotW}" height="${TH}" fill="none" stroke="${line}"/>`;
  [thi, (thi+tlo)/2, tlo].forEach(v=>{ const yy=yT(v);
    s+=`<line x1="${ML}" y1="${yy}" x2="${ML+plotW}" y2="${yy}" stroke="${line}" stroke-dasharray="2,3"/>`;
    s+=`<text x="${ML-6}" y="${yy+3}" fill="${muted}" font-size="10" text-anchor="end">${Math.round(v)}°</text>`;
  });
  // temp line (break gaps > 2.5x median)
  const pts=rows.filter(r=>r.temp!=null);
  let dAttr="", prev=null;
  pts.forEach(r=>{ const X=x(r.ts),Y=yT(r.temp);
    dAttr += (prev && (r.ts-prev.ts)>2.5*med ? ` M${X},${Y}` : (dAttr?` L${X},${Y}`:`M${X},${Y}`)); prev=r; });
  s+=`<path d="${dAttr}" fill="none" stroke="${COL.fire}" stroke-width="2"/>`;
  if(pts.length<=80) pts.forEach(r=> s+=`<circle cx="${x(r.ts)}" cy="${yT(r.temp)}" r="2.5" fill="${COL.fire}"/>`);
  s+=`<text x="${ML}" y="${PT-2}" fill="${muted}" font-size="10">Boiler temp (°F)</text>`;

  // --- status lanes (aligned to same x) ---
  LANES.forEach((ln,i)=>{ const y=lanesTop + i*(LH+LG);
    s+=`<text x="${ML-6}" y="${y+LH/2+3}" fill="${muted}" font-size="10" text-anchor="end">${ln.label}</text>`;
    for(let k=0;k<rows.length;k++){
      const x0=x(rows[k].ts);
      let x1 = k<rows.length-1 ? x(rows[k+1].ts) : Math.min(ML+plotW, x0 + (plotW*med/span));
      // break the band if there's a big gap to the next sample
      if(k<rows.length-1 && (rows[k+1].ts-rows[k].ts) > 2.5*med) x1 = Math.min(x1, x0 + (plotW*med/span));
      const w=Math.max(1.5, x1-x0);
      s+=`<rect x="${x0}" y="${y}" width="${w}" height="${LH}" fill="${ln.color(rows[k])}" rx="2"/>`;
    }
  });

  // hover cursor
  s+=`<line id="cursor" x1="-5" y1="${PT}" x2="-5" y2="${lanesTop+LANES.length*(LH+LG)-LG}" stroke="${fg}" stroke-width="1" opacity="0"/>`;
  s+=`<rect id="cap" x="${ML}" y="${PT}" width="${plotW}" height="${lanesTop+LANES.length*(LH+LG)-LG-PT}" fill="transparent"/>`;
  s+=`</svg><div class="tip" id="tip"></div>`;
  host.innerHTML=s;

  SAMP = rows.map(r=>({r, x:x(r.ts)}));
  wireHover(host, ML, ML+plotW);
}

function wireHover(host, xlo, xhi){
  const cap=host.querySelector("#cap"), cur=host.querySelector("#cursor"), tip=host.querySelector("#tip");
  function move(ev){
    const rect=host.getBoundingClientRect();
    const mx=(ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left;
    let best=null,bd=1e9; SAMP.forEach(s=>{const d=Math.abs(s.x-mx); if(d<bd){bd=d;best=s;}});
    if(!best) return;
    cur.setAttribute("x1",best.x); cur.setAttribute("x2",best.x); cur.setAttribute("opacity","0.6");
    const r=best.r;
    const P=on=>on?'<b style="color:#34c759">ON</b>':'<span style="color:#9aa0a6">off</span>';
    tip.innerHTML = `<b>${fmt(r.ts,true)}</b><br>`+
      `${r.temp!=null?r.temp+'°F':'—'} · ${!r.legible?'<span style="color:#ff3b30">screen out</span>':(r.mode||'—')}`+
      `${r.flame?' · <b style="color:#ff7a1a">🔥 flame</b>':''}`+
      `${r.codes.length?' · <b style="color:#ff3b30">'+r.codes.join(",")+'</b>':''}<br>`+
      `Pwr ${P(r.power)} · Z1 ${P(r.z1)} · Z2 ${P(r.z2)} · Z3 ${P(r.z3)}`;
    tip.style.display="block";
    let tx=Math.max(xlo, Math.min(xhi, best.x)); tip.style.left=tx+"px"; tip.style.top="2px";
  }
  cap.addEventListener("mousemove",move);
  cap.addEventListener("touchstart",move); cap.addEventListener("touchmove",move);
  cap.addEventListener("mouseleave",()=>{cur.setAttribute("opacity","0"); tip.style.display="none";});
}

/* ---------------- live cards + table ---------------- */
function renderLive(){
  const last=[...ALL].reverse().find(r=>r.hasB)||{}, lastZ=[...ALL].reverse().find(r=>r.hasZ)||{};
  $("b-img").src="stills/boiler_latest.jpg?t="+Date.now();
  $("z-img").src="stills/zone_latest.jpg?t="+Date.now();
  const mode=last.mode||"—";
  $("b-mode").textContent=mode;
  $("b-mode").className="pill "+(mode==="heating"?"warn":mode==="dhw"?"dhw":mode==="idle"?"ok":"off");
  const P=on=>on?'<span class="pill ok">ON</span>':'<span class="pill off">off</span>';
  $("b-rows").innerHTML = [
    ["Temperature", last.temp!=null?last.temp+"°F":"—"],
    ["Mode", mode],
    ["Flame", last.flame?'<span class="pill warn">firing</span>':'<span class="pill off">off</span>'],
    ["Errors", (last.codes&&last.codes.length)?'<span class="pill bad">'+last.codes.join(", ")+'</span>':'<span class="pill ok">none</span>'],
    ["Screen", last.legible===false?'<span class="pill bad">unreadable</span>':'<span class="pill ok">legible</span>'],
  ].map(([k,v])=>`<div class="row"><span class="k">${k}</span><span>${v}</span></div>`).join("");
  $("z-pwr").textContent=lastZ.power?"power on":"power off";
  $("z-pwr").className="pill "+(lastZ.power?"ok":"bad");
  $("z-rows").innerHTML = [["Power",P(lastZ.power)],["Zone 1",P(lastZ.z1)],["Zone 2",P(lastZ.z2)],["Zone 3",P(lastZ.z3)]]
    .map(([k,v])=>`<div class="row"><span class="k">${k}</span><span>${v}</span></div>`).join("");

  // alert banner from most recent reading
  const probs=[]; if(last.codes&&last.codes.length) probs.push("error "+last.codes.join(", "));
  if(last.legible===false) probs.push("boiler screen unreadable");
  const b=$("banner");
  if(probs.length){ b.className="banner bad"; b.textContent="⚠️ "+probs.join(" · "); }
  else { b.className="banner ok"; b.textContent="✅ All normal"; }
}

function renderTable(rows){
  const P=on=>`<span class="pill ${on?'ok':'off'}">${on?'ON':'·'}</span>`;
  $("tbody").innerHTML = rows.slice().reverse().slice(0,60).map(r=>{
    const mode=!r.legible?'<span class="pill bad">screen out</span>'
      :r.mode==="heating"?'<span class="pill warn">heating</span>'
      :r.mode==="dhw"?'<span class="pill dhw">dhw</span>'
      :`<span class="pill off">${r.mode||'—'}</span>`;
    return `<tr><td>${fmt(r.ts,true)}</td><td>${r.temp??'—'}</td><td>${mode}</td>
      <td>${r.flame?'🔥':'·'}</td><td>${P(r.power)}</td><td>${P(r.z1)}</td><td>${P(r.z2)}</td><td>${P(r.z3)}</td>
      <td>${r.codes.length?'<span class="pill bad">'+r.codes.join(", ")+'</span>':'—'}</td></tr>`;
  }).join("") || `<tr><td colspan="9" class="empty">No readings yet.</td></tr>`;
}

function renderAll(){
  const rows=windowed();
  renderLive();
  renderTimeline(rows);
  renderTable(rows);
  const span = rows.length ? `${fmt(rows[0].ts,true)} → ${fmt(rows[rows.length-1].ts,true)}` : "";
  $("rangeLbl").textContent = span;
  $("sub").textContent = `${ALL.length} readings total · showing ${rows.length}`;
}

function renderAlerts(list){
  const kindPill = k => k==="problem" ? '<span class="pill bad">problem</span>'
    : k==="cleared" ? '<span class="pill ok">cleared</span>'
    : '<span class="pill off">suppressed</span>';
  const delivPill = d => d==="sent" ? '<span class="pill ok">sent</span>'
    : d==="failed" ? '<span class="pill bad">failed</span>'
    : d==="suppressed" ? '<span class="pill off">throttled</span>'
    : '<span class="pill warn">not configured</span>';
  $("abody").innerHTML = list.slice().reverse().slice(0,80).map(a=>{
    const det = (a.problems&&a.problems.length? a.problems.join(", ") : (a.message||"").replace(/^[^A-Za-z0-9]+\s*/,""))
      + (a.error? ` — ${a.error}` : "");
    return `<tr><td>${fmt(Date.parse(a.timestamp||a.local)||0,true)}</td><td>${kindPill(a.kind)}</td>
      <td>${delivPill(a.delivery)}</td><td style="white-space:normal">${det}</td></tr>`;
  }).join("") || `<tr><td colspan="4" class="empty">No alerts recorded yet — nothing has gone wrong. 🎉</td></tr>`;
}

async function loadAlerts(){
  try{
    const r=await fetch("stills/alerts.jsonl?t="+Date.now(), {cache:"no-store"});
    if(!r.ok){ renderAlerts([]); return; }
    const text=await r.text();
    const list=text.trim().split("\n").filter(Boolean).map(l=>{try{return JSON.parse(l);}catch(e){return null;}}).filter(Boolean);
    renderAlerts(list);
  }catch(e){ renderAlerts([]); }
}

async function load(){
  try{
    const r=await fetch("stills/readings.jsonl?t="+Date.now(), {cache:"no-store"});
    const text=await r.text();
    ALL=text.trim().split("\n").filter(Boolean).map(l=>{try{return parseLine(JSON.parse(l));}catch(e){return null;}}).filter(Boolean);
    ALL.sort((a,b)=>a.ts-b.ts);
    renderAll();
  }catch(e){ $("sub").textContent="Could not load readings ("+e+")"; }
  loadAlerts();
}

$("ctls").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON") return;
  WINDOW_H=parseInt(e.target.dataset.h,10);
  [...$("ctls").querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b===e.target));
  renderAll();
});
let rz; window.addEventListener("resize",()=>{clearTimeout(rz); rz=setTimeout(()=>renderTimeline(windowed()),150);});
load();
setInterval(load, 5*60*1000);
</script>
</body>
</html>
